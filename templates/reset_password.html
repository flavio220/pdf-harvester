<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Harvester — Nouveau mot de passe</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#4fffb0;--accent3:#ff6b6b;--t:.22s cubic-bezier(.4,0,.2,1)}
[data-theme="dark"]{--bg:#06080d;--surface:#0d1117;--surface2:#141920;--border:#1a2030;--text:#e2e8f4;--muted:#506080}
[data-theme="light"]{--bg:#f0f4fb;--surface:#ffffff;--surface2:#eaeff8;--border:#cfd8ec;--text:#18202e;--muted:#7a8aaa}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;transition:background var(--t),color var(--t)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:48px;max-width:420px;width:100%}
.logo{display:flex;align-items:center;gap:8px;margin-bottom:32px}
.logo-name{font-family:'Playfair Display',serif;font-size:18px;font-weight:800;color:var(--accent)}
.title{font-family:'Playfair Display',serif;font-size:26px;font-weight:800;margin-bottom:8px}
.sub{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:28px}
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.form-input{width:100%;padding:13px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Outfit',sans-serif;font-size:14px;outline:none;transition:all var(--t)}
.form-input:focus{border-color:rgba(79,255,176,.4);box-shadow:0 0 0 3px rgba(79,255,176,.07)}
.form-input::placeholder{color:var(--muted)}
.btn{width:100%;padding:14px;background:var(--accent);color:#000;border:none;border-radius:10px;font-family:'Outfit',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all var(--t)}
.btn:hover{background:#2de896;transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.msg{margin-top:14px;padding:11px 15px;border-radius:8px;font-size:12px;display:none}
.msg.err{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.2);color:var(--accent3)}
.msg.ok{background:rgba(79,255,176,.08);border:1px solid rgba(79,255,176,.2);color:var(--accent)}
</style>
<script>
(function(){
  var t = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
</head>
<body>
<div class="card">
  <div class="logo"><span>📄</span><span class="logo-name">PDF Harvester</span></div>
  <h1 class="title">🔑 Nouveau mot de passe</h1>
  <p class="sub">Choisis un nouveau mot de passe pour ton compte.</p>

  <div class="form-group">
    <label class="form-label">Nouveau mot de passe</label>
    <input type="password" id="pwd1" class="form-input" placeholder="6 caractères minimum">
  </div>
  <div class="form-group">
    <label class="form-label">Confirmer le mot de passe</label>
    <input type="password" id="pwd2" class="form-input" placeholder="Répète ton mot de passe">
  </div>

  <button class="btn" id="btn" onclick="doReset()">Enregistrer le mot de passe</button>
  <div class="msg err" id="err"></div>
  <div class="msg ok" id="ok"></div>
</div>

<script>
const TOKEN = '{{ token }}';

function show(id, msg) {
  ['err','ok'].forEach(x => {
    document.getElementById(x).style.display = 'none';
  });
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = 'block';
}

async function doReset() {
  const pwd1 = document.getElementById('pwd1').value;
  const pwd2 = document.getElementById('pwd2').value;
  if (!pwd1 || !pwd2) return show('err', 'Remplis les deux champs');
  if (pwd1.length < 6) return show('err', 'Mot de passe trop court (6 min)');
  if (pwd1 !== pwd2) return show('err', 'Les mots de passe ne correspondent pas');

  document.getElementById('btn').disabled = true;
  try {
    const r = await fetch('/api/reset-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ token: TOKEN, password: pwd1 })
    }).then(r => r.json());

    if (r.error) {
      show('err', r.error);
    } else {
      show('ok', r.message + ' Redirection...');
      setTimeout(() => window.location.href = r.redirect || '/auth', 1500);
    }
  } catch(e) {
    show('err', 'Erreur de connexion au serveur');
  }
  document.getElementById('btn').disabled = false;
}

document.getElementById('pwd2').addEventListener('keydown', e => e.key === 'Enter' && doReset());
</script>
</body>
</html>
